name: Card price tracker

# Needed so the workflow can push updated data files back to the repo.
permissions:
  contents: write

on:
  schedule:
    # Numeric price update every 4 hours (0 LLM tokens)
    - cron: "0 */4 * * *"
    # Daily AI market analysis at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      with_analysis:
        description: "Refresh AI analysis (--with-analysis)"
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update prices
        env:
          PRICECHARTING_API_TOKEN: ${{ secrets.PRICECHARTING_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          USD_TO_HKD: "7.8"
        run: |
          if [ "${{ github.event.schedule }}" = "0 9 * * *" ] || [ "${{ inputs.with_analysis }}" = "true" ]; then
            python update_prices.py --with-analysis
          else
            python update_prices.py
          fi

      - name: Commit and push data
        run: |
          git config user.name "card-tracker-bot"
          git config user.email "card-tracker-bot@users.noreply.github.com"
          git add data/history_prices.json data/latest_summary.json
          git diff --cached --quiet || git commit -m "tracker: price update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
